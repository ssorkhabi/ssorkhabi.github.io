<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>

    <!-- Tab icon -->
    <link rel="icon" type="image/png" href="{{ '/vis/mec-mes.png' | relative_url }}" />

    <!-- Fonts and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700;1,900&display=swap" rel="stylesheet" />

    <!-- Site stylesheets -->
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/css/responsive.css' | relative_url }}" />
  </head>
  <body>
    {% capture nav_links %}
      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.title == "Home" %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/research' | relative_url }}" {% if page.title == "Research" %}class="active"{% endif %}>Research</a></li>
        <li><a href="{{ '/cv' | relative_url }}" {% if page.title == "CV" %}class="active"{% endif %}>CV</a></li>
      </ul>
    {% endcapture %}

    <!-- Top nav (computer) -->
    <nav class="nav-bar">{{ nav_links }}</nav>

    <h1>{{ site.title }}</h1>

    {{ content }}

    <footer>
      <a href="https://bsky.app/profile/ssorkhabi.bsky.social" class="social-icon" target="_blank" aria-label="Bluesky">
        <i class="fa-brands fa-bluesky"></i>
      </a>
      <a href="mailto:ss3335@cam.ac.uk" class="social-icon" aria-label="Email">
        <i class="fa-solid fa-envelope"></i>
      </a>
      <a href="https://github.com/ssorkhabi" class="social-icon" target="_blank" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </footer>

    <!-- Bottom nav (phone) -->
    <nav class="nav-bar-bottom">{{ nav_links }}</nav>
  </body>
</html>
